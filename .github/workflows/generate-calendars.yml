name: Generate ClimoCal Calendars

on:
  schedule:
    - cron: '0 10 * * *'    # Daily at 6 AM Toronto time (10 UTC)
  workflow_dispatch:         # Manual trigger button
  push:
    branches: [main]         # Regenerate on code changes

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      # Fails the run if any city fails or a feed comes out short. A failed run
      # never reaches deploy, so the site keeps serving yesterday's complete set,
      # and GitHub emails the repo owner about the failed scheduled run.
      - name: Generate calendar files
        run: node scripts/generate-calendars.js
        env:
          TZ: 'America/Toronto'  # Set timezone for generation

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity; that froze every feed from 2025-12-27 to 2026-10-27.
  # Re-enabling the workflow through the API resets that clock without
  # committing anything, so the daily schedule keeps itself alive.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'   # schedule, or a manual run to test it
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/generate-calendars.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
